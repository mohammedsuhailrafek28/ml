# Local full-stack run:  docker compose up --build
# Copy .env.example -> .env first and set ALLOWED_ORIGINS / API_KEY as needed.
services:
  api:
    build: .
    image: medical-ai-api
    environment:
      APP_ENV: ${APP_ENV:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      API_KEY: ${API_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-65536}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time. Must be reachable from the
        # end user's browser (the Docker host), not an internal service name.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: medical-ai-web
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
